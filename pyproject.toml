[project]
name = "hy-motion-1-0"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==0.30.1",
    "bitsandbytes==0.49.0",
    "click==8.1.3",
    "diffusers==0.26.3",
    "einops==0.8.1",
    "fbxsdkpy==2020.1.post2",
    "gradio>=5.38.2",
    "huggingface-hub==0.30.0",
    "numpy>=1.24.0,<2.0",
    "omegaconf==2.3.0",
    "openai==1.78.1",
    "pyyaml>=6.0.1",
    "requests==2.32.4",
    "safetensors==0.5.3",
    "scipy>=1.10.0",
    "torch>=2.9.1",
    "torchdiffeq==0.2.5",
    "torchvision>=0.24.1",
    "transformers==4.53.3",
    "transforms3d==0.4.2",
]

[[tool.uv.index]]
url = "https://gitlab.inria.fr/api/v4/projects/18692/packages/pypi/simple"
extra = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

